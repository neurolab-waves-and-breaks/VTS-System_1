# Explicit opt-in: experimental, non-connectable manufacturer advertising.
# The ESB receiver is paused for a requested 200 ms on periodic (~5 s) or
# post-SELECTION_COMMITTED priority windows (only when CLIC/ESB is idle).
# Hardware scheduling/latency must be measured; first bench check: stimulation OFF.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="VTS-v112-test"
CONFIG_BT_MAX_CONN=1
CONFIG_ESB_MPSL_TIMESLOT=y
CONFIG_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_VTS_BLE_TELEMETRY=y
CONFIG_VTS_BLE_INTERVAL_MS=5000
CONFIG_VTS_BLE_WINDOW_MS=200
